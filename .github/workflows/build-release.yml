name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build macOS application
        run: make debug-mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: dist/CWLed-Installer.dmg

  build-linux:
    name: Build Linux Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build Linux application
        run: make debug-linux

      - name: Upload Linux Tarball
        uses: actions/upload-artifact@v5
        with:
          name: linux-tarball
          path: dist/CWLed-Linux.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: macos-dmg
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: linux-tarball
          path: dist/

      - name: Read NOTES.txt & Determine Tag
        id: prep
        run: |
          # Read and parse the version from NOTES.txt
          VERSION=$(awk -F ":" '/^Version/ {print $2}' NOTES.txt | tr -d ' ')
          if [ -z "$VERSION" ]; then
            VERSION=$(awk -F ":" '{print $2}' NOTES.txt | head -n 1 | tr -d ' ')
          fi
          
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          fi
          
          # Read NOTES.txt, escape special characters for multi-line output in GHA
          if [ -f NOTES.txt ]; then
            echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
            cat NOTES.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "RELEASE_NOTES=Automated release of CWLed version $VERSION" >> $GITHUB_ENV
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: |
            dist/CWLed-Installer.dmg
            dist/CWLed-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
